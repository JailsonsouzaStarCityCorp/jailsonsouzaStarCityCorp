<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
  <defs>
    <linearGradient id="plin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C3EE"/>
      <stop offset="0.3" stop-color="#3D7BFF"/>
      <stop offset="0.55" stop-color="#8B3DFF"/>
      <stop offset="0.78" stop-color="#F032E6"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 17px; fill: #F5F3FA; opacity: 0; }
    .p { fill: #A35BFF; font-weight: 700; }
    .ok { fill: #2BD67B; }
    .dim { fill: #ABA5BF; }
    .hl { fill: #22C3EE; }
    .title { font-family: 'Fira Code', Consolas, monospace; font-size: 13px; fill: #ABA5BF; }
    .l1 { animation: l1 14s infinite; }
    .l2 { animation: l2 14s infinite; }
    .l3 { animation: l3 14s infinite; }
    .l4 { animation: l4 14s infinite; }
    .l5 { animation: l5 14s infinite; }
    .l6 { animation: l6 14s infinite; }
    .l7 { animation: l7 14s infinite; }
    .l8 { animation: l8 14s infinite; }
    @keyframes l1 { 0%,3% {opacity:0} 5%,92% {opacity:1} 96%,100% {opacity:0} }
    @keyframes l2 { 0%,10% {opacity:0} 12%,92% {opacity:1} 96%,100% {opacity:0} }
    @keyframes l3 { 0%,20% {opacity:0} 22%,92% {opacity:1} 96%,100% {opacity:0} }
    @keyframes l4 { 0%,28% {opacity:0} 30%,92% {opacity:1} 96%,100% {opacity:0} }
    @keyframes l5 { 0%,38% {opacity:0} 40%,92% {opacity:1} 96%,100% {opacity:0} }
    @keyframes l6 { 0%,45% {opacity:0} 47%,92% {opacity:1} 96%,100% {opacity:0} }
    @keyframes l7 { 0%,68% {opacity:0} 70%,92% {opacity:1} 96%,100% {opacity:0} }
    @keyframes l8 { 0%,78% {opacity:0} 80%,92% {opacity:1} 96%,100% {opacity:0} }
    .prog { animation: prog 14s infinite; }
    @keyframes prog { 0%,47% {width:0} 66%,92% {width:300px} 96%,100% {width:0} }
    .cur { animation: blink 1s steps(1) infinite; fill: #F032E6; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="820" height="320" rx="12" fill="#0B0A12" stroke="#2C2840"/>
  <rect width="820" height="36" rx="12" fill="#16141F"/>
  <rect y="24" width="820" height="12" fill="#16141F"/>
  <rect y="35" width="820" height="2" fill="url(#plin)"/>
  <circle cx="22" cy="18" r="6" fill="#FF3B5C"/>
  <circle cx="42" cy="18" r="6" fill="#FFC21A"/>
  <circle cx="62" cy="18" r="6" fill="#2BD67B"/>
  <text class="title" x="410" y="23" text-anchor="middle">jailson@jotaexplica: ~/projetos</text>

  <text class="t l1" x="24" y="72"><tspan class="p">$</tspan> whoami</text>
  <text class="t l2" x="24" y="102">jailson — analista de suporte &amp; dados <tspan class="p">→</tspan> dev de apps</text>
  <text class="t l3" x="24" y="137"><tspan class="p">$</tspan> cat stack.txt</text>
  <text class="t l4" x="24" y="167"><tspan class="dim">python · sql · aws · oci · grafana · zabbix · android</tspan></text>
  <text class="t l5" x="24" y="202"><tspan class="p">$</tspan> ./build meu-app <tspan class="hl">--android</tspan></text>

  <g class="t l6">
    <rect x="24" y="216" width="300" height="16" rx="8" fill="#1F1C2B"/>
    <rect class="prog" x="24" y="216" width="0" height="16" rx="8" fill="url(#plin)"/>
  </g>
  <text class="t l7" x="340" y="230"><tspan class="ok">✔ build concluído</tspan></text>
  <text class="t l8" x="24" y="277"><tspan class="p">$</tspan> git push origin main <tspan class="cur">█</tspan></text>
</svg>
